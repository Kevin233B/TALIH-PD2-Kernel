name: Build LKM Modules

on:
  push:
    branches: [ main, resukisu-susfs, susfs-v2.2.0 ]
  workflow_dispatch:
    inputs:
      branch:
        description: '内核分支（all = main + resukisu-susfs + susfs-v2.2.0）'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - main
          - resukisu-susfs
          - susfs-v2.2.0

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.set.outputs.branches }}
    steps:
      - name: Select target branches
        id: set
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'branches=["${{ github.ref_name }}"]' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.branch }}" = "all" ] || [ -z "${{ github.event.inputs.branch }}" ]; then
            echo 'branches=["main","resukisu-susfs","susfs-v2.2.0"]' >> "$GITHUB_OUTPUT"
          else
            echo 'branches=["${{ github.event.inputs.branch }}"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: select
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.select.outputs.branches) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libc6-dev linux-libc-dev device-tree-compiler cpio gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf git wget xz-utils python3 python3-pip patch

      - name: Integrate SU + SUSFS (mirror per-branch build.yml)
        run: |
          case "${{ matrix.branch }}" in
            resukisu-susfs)
              rm -rf KernelSU drivers/kernelsu
              git checkout -- drivers/Makefile drivers/Kconfig
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
              # 4.19 inline ABI 兼容（同 build.yml：防 main 驱动 SUSFS 变体二次解引用变砖）
              cat patch/56_resukisu_sucompat_4_19_inline_abi.fragment.c >> KernelSU/kernel/feature/sucompat.c
              grep -q "ksu_handle_faccessat_4_19" KernelSU/kernel/feature/sucompat.c || { echo "::error::patch/56 片段追加失败"; exit 1; }
              patch -p1 < patch/50_add_susfs_in_kernel-4.19.patch
              patch -p1 < patch/55_resukisu_susfs_abi_compat.patch
              ;;
            susfs-v2.2.0)
              rm -rf KernelSU drivers/kernelsu
              git checkout -- drivers/Makefile drivers/Kconfig
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
              patch -p1 < patch/50_add_susfs_in_kernel-4.19.patch
              patch -p1 < patch/55_resukisu_susfs_abi_compat.patch
              ;;
            main)
              echo "main 分支：无 SU/SUSFS 集成，直接编内核"
              ;;
          esac

      - name: Build kernel (full build for out/Module.symvers)
        run: |
          chmod +x build-mt8797.sh download_clang.sh
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          ./download_clang.sh
          ./build-mt8797.sh

      - name: Build LKM-PathMask (pathmask.ko + procguard.ko, upstream v2.8.2)
        continue-on-error: true
        run: |
          git clone --depth 1 --branch v2.8.2 https://github.com/Andrea-lyz/LKM-PathMask lkms/LKM-PathMask
          patch -p1 -d lkms/LKM-PathMask < patch/lkm/pathmask_4.19_compat.patch
          CLANG_PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r383902"
          CLANG_BIN="$CLANG_PATH/bin"
          make -k O=out ARCH=arm64 \
            CC=$CLANG_BIN/clang LD=$CLANG_BIN/ld.lld AR=$CLANG_BIN/llvm-ar NM=$CLANG_BIN/llvm-nm \
            OBJCOPY=$CLANG_BIN/llvm-objcopy OBJDUMP=$CLANG_BIN/llvm-objdump READELF=$CLANG_BIN/llvm-readelf \
            OBJSIZE=$CLANG_BIN/llvm-size STRIP=$CLANG_BIN/llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            M=$PWD/lkms/LKM-PathMask/kernel modules

      - name: Build hma-uidfake (hma_uidfake.ko)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/KodateMitsuru/hma-uidfake lkms/hma-uidfake
          patch -p1 -d lkms/hma-uidfake < patch/lkm/hma_uidfake_4.19_compat.patch
          CLANG_PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r383902"
          CLANG_BIN="$CLANG_PATH/bin"
          make -k O=out ARCH=arm64 \
            CC=$CLANG_BIN/clang LD=$CLANG_BIN/ld.lld AR=$CLANG_BIN/llvm-ar NM=$CLANG_BIN/llvm-nm \
            OBJCOPY=$CLANG_BIN/llvm-objcopy OBJDUMP=$CLANG_BIN/llvm-objdump READELF=$CLANG_BIN/llvm-readelf \
            OBJSIZE=$CLANG_BIN/llvm-size STRIP=$CLANG_BIN/llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            M=$PWD/lkms/hma-uidfake/src modules

      - name: Build Kasumi (kasumi_lkm.ko)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/Rouyashiki/Kasumi lkms/Kasumi
          patch -p1 -d lkms/Kasumi < patch/lkm/kasumi_4.19_compat.patch
          CLANG_PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r383902"
          CLANG_BIN="$CLANG_PATH/bin"
          make -k O=out ARCH=arm64 \
            CC=$CLANG_BIN/clang LD=$CLANG_BIN/ld.lld AR=$CLANG_BIN/llvm-ar NM=$CLANG_BIN/llvm-nm \
            OBJCOPY=$CLANG_BIN/llvm-objcopy OBJDUMP=$CLANG_BIN/llvm-objdump READELF=$CLANG_BIN/llvm-readelf \
            OBJSIZE=$CLANG_BIN/llvm-size STRIP=$CLANG_BIN/llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            M=$PWD/lkms/Kasumi/src modules

      - name: Collect and report LKMs
        run: |
          mkdir -p modules-out
          found=0
          while IFS= read -r ko; do
            cp "$ko" modules-out/
            found=$((found+1))
          done < <(find lkms -name '*.ko' -type f)
          if [ "$found" -eq 0 ]; then
            echo "::error::没有任何 LKM 编译成功（.ko 数量为 0）"
            exit 1
          fi
          ls -la modules-out/
          echo "共编出 $found 个 .ko"

      - name: Loadability gate (config + mechanism imports + symvers resolution)
        run: |
          fail=0
          # 1) 内核侧硬前提：KPROBES + FUNCTION_TRACER（缺失 = 4.19 头文件 inline 桩路线，insmod 必失败）
          for cfg in CONFIG_KPROBES CONFIG_FUNCTION_TRACER; do
            if ! grep -q "^${cfg}=y$" out/.config; then
              echo "::error::out/.config 缺少 ${cfg}=y —— kprobe/ftrace 机制会被内核头文件的 inline 桩消除，模块 insmod 必失败"
              fail=1
            else
              echo "config OK: ${cfg}=y"
            fi
          done
          # 2) 每个 .ko：核心机制导入必须在（防死代码消除假绿）+ 全部强未定义导入必须能在 out/Module.symvers 解析
          check_ko() {
            ko=$1; shift
            if [ ! -f "modules-out/$ko" ]; then
              echo "::error::modules-out/$ko 缺失"
              fail=1
              return 0
            fi
            und=$(nm "modules-out/$ko" | awk '$1=="U"{print $2}' | sort -u)
            for sym in "$@"; do
              if ! printf '%s\n' "$und" | grep -qx "$sym"; then
                echo "::error::$ko 缺少核心机制导入 $sym —— 机制被编译器当死代码消除或内核 CONFIG 未开，insmod 后功能不成立"
                fail=1
              fi
            done
            miss=0
            while IFS= read -r s; do
              [ -n "$s" ] || continue
              if ! awk -v s="$s" '$2==s{f=1} END{exit !f}' out/Module.symvers; then
                echo "::error::$ko 导入 $s 无法在 out/Module.symvers 解析 —— insmod 会报 Unknown symbol"
                miss=1
                fail=1
              fi
            done <<< "$und"
            if [ "$miss" -eq 0 ]; then
              echo "$ko: 核心导入齐全，全部 $(printf '%s\n' "$und" | wc -l) 个 UND 导入解析 OK"
            fi
            v=$(readelf -p .modinfo "modules-out/$ko" 2>/dev/null | sed -n 's/.*vermagic=//p' | head -1)
            echo "  $ko vermagic: $v"
          }
          check_ko pathmask.ko register_kprobe register_kretprobe unregister_kprobe unregister_kretprobe
          check_ko procguard.ko register_kretprobe unregister_kretprobe
          check_ko hma_uidfake.ko get_task_cred find_user free_uid
          check_ko kasumi_lkm.ko register_kprobe register_kretprobe
          if [ "$fail" -ne 0 ]; then
            echo "::error::可加载性门禁失败（详见上方 ::error 行）"
            exit 1
          fi
          echo "可加载性门禁通过：内核 CONFIG 前提 + 机制导入 + 全符号解析全部 OK"

      - name: Upload LKMs (${{ matrix.branch }})
        uses: actions/upload-artifact@v4
        with:
          name: lkm-modules-${{ matrix.branch }}
          path: modules-out/*.ko
          retention-days: 14
          if-no-files-found: error
