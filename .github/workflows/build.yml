name: Build and Release Kernel

on:
  push:
    branches: [ main, master, resukisu-susfs ]
    tags: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libc6-dev linux-libc-dev device-tree-compiler cpio gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf git wget xz-utils python3 python3-pip patch

      - name: Pull ReSukiSU (latest main) and integrate
        run: |
          # 仓库中不再内置 KernelSU 源码，按官方流程拉取最新 ReSukiSU（保留 .git，Kbuild 需要）
          rm -rf KernelSU drivers/kernelsu
          git checkout -- drivers/Makefile drivers/Kconfig
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Apply SUSFS kernel patch (4.19, non-GKI)
        run: |
          patch -p1 < patch/50_add_susfs_in_kernel-4.19.patch

      - name: Build kernel
        run: |
          chmod +x build-mt8797.sh
          chmod +x download_clang.sh
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          ./download_clang.sh
          ./build-mt8797.sh

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image.gz
            out/System.map
            out/vmlinux
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Image.gz
        uses: actions/download-artifact@v4
        with:
          name: kernel-image

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kernel MT8797 ${{ github.ref_name }}
          body: Kernel Image.gz for MT8797 (ReSukiSU + SUSFS)
          files: Image.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
