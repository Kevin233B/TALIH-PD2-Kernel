name: Build and Release Kernel

on:
  push:
    branches: [ main, master, resukisu-susfs, susfs-v2.2.0 ]
    tags: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libc6-dev linux-libc-dev device-tree-compiler cpio gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf git wget xz-utils python3 python3-pip patch

      - name: Pull ReSukiSU (latest main) and integrate
        run: |
          # 仓库中不再内置 KernelSU 源码，按官方流程拉取最新 ReSukiSU（保留 .git，Kbuild 需要）
          rm -rf KernelSU drivers/kernelsu
          git checkout -- drivers/Makefile drivers/Kconfig
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Apply SUSFS kernel patch (4.19, non-GKI)
        run: |
          patch -p1 < patch/50_add_susfs_in_kernel-4.19.patch
          patch -p1 < patch/55_resukisu_susfs_abi_compat.patch

      - name: Build kernel
        run: |
          chmod +x build-mt8797.sh
          chmod +x download_clang.sh
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          ./download_clang.sh
          ./build-mt8797.sh

      - name: Verify SUSFS integration
        run: |
          grep -q '^CONFIG_KSU_SUSFS=y' out/.config || { echo "::error::CONFIG_KSU_SUSFS 未在最终 .config 中启用（kconfig 丢弃了该选项）"; exit 1; }
          [ -f out/fs/susfs.o ] || { echo "::error::out/fs/susfs.o 未编译，SUSFS 内核侧缺失"; exit 1; }
          grep -q 'susfs_show_version' out/System.map || { echo "::error::System.map 中无 susfs_show_version，链接产物缺 SUSFS"; exit 1; }
          echo "SUSFS 验证通过：CONFIG_KSU_SUSFS=y、fs/susfs.o、System.map 符号齐全"

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image.gz
            out/System.map
            out/vmlinux
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Image.gz
        uses: actions/download-artifact@v4
        with:
          name: kernel-image

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kernel MT8797 ${{ github.ref_name }}
          body: Kernel Image.gz for MT8797 (ReSukiSU + SUSFS)
          files: Image.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
