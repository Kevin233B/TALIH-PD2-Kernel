name: KMI Probe (gki_defconfig vs abi_gki_aarch64.xml)

# Stage 1 锚点专用：编 gki_defconfig vmlinux → vmlinux.symvers，跑 kmi_probe.py 比对树内
# google/android12-5.10.264 纯基线的冻结 KMI（android/abi_gki_aarch64.xml，7298 符号）是否被自证复现。
# 独立 workflow，与 build-kernel.yml（ls12 可开机构建）完全隔离：gki 探测失败不阻塞开机产物。
#
# 判定门槛（见 .github/scripts/kmi_probe.py 注释）：crc_diff（同名异 CRC）必须 =0，
# 否则 gki_defconfig 构建与声明 KMI 不一致 = 核心层已被破坏，官方 ko 无法对齐。

on:
  workflow_dispatch:
  push:
    branches: [ gki-5.10-rebase ]
  pull_request:
    branches: [ gki-5.10-rebase ]

jobs:
  probe:
    name: gki_defconfig KMI probe
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official Clang toolchain (clang-r416183b)
        run: |
          set -eo pipefail
          mkdir -p prebuilts-master/clang/host/linux-x86/clang-r416183b
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/6e3223f76384455acde43affde3df0ea9df66c0d/clang-r416183b.tar.gz" \
            -o /tmp/clang-r416183b.tar.gz
          tar -xzf /tmp/clang-r416183b.tar.gz -C prebuilts-master/clang/host/linux-x86/clang-r416183b
          rm -f /tmp/clang-r416183b.tar.gz

      - name: Fetch official binutils (gas)
        run: |
          set -eo pipefail
          mkdir -p prebuilts/gas/linux-x86
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://android.googlesource.com/platform/prebuilts/gas/linux-x86/+archive/b2a189331333e014bfef4c0425b3ef4b74accdd0.tar.gz" \
            -o /tmp/gas.tar.gz
          tar -xzf /tmp/gas.tar.gz -C prebuilts/gas/linux-x86
          rm -f /tmp/gas.tar.gz

      - name: Install cross binutils + host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc flex bison libssl-dev libelf-dev libncurses-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      # gki_defconfig 可能不含 DEBUG_INFO_BTF（BTF 由 build.config.gki 的 debug 片段另行开启），
      # 但为与可开机构建链完全一致仍钉 pahole 1.20（无害；若 gki_defconfig 真带 BTF 也能过）。
      - name: Install pahole 1.20 (5.10-compatible BTF)
        run: |
          set -eo pipefail
          curl -fsSL --retry 3 --retry-delay 5 \
            "http://old-releases.ubuntu.com/ubuntu/pool/universe/d/dwarves-dfsg/dwarves_1.20-1_amd64.deb" \
            -o /tmp/dwarves_1.20-1_amd64.deb
          echo "67efe8ddbf5e16b84a5aa322f4e02955a6939dbbb615dca1f590071641e0acef  /tmp/dwarves_1.20-1_amd64.deb" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y /tmp/dwarves_1.20-1_amd64.deb
          pahole --version

      # LTO_CLANG_FULL 的 vmlinux.o 链接是 ld.lld whole-program 优化，内存峰值远超免费 runner 的
      # 物理内存（官方 GKI KMI 在 32GB+ 机器构建）；内存不足会卡死/OOM 在 vmlinux.o。
      # 应对：加独立 swap 文件，用磁盘换虚拟内存扛过 LTO 峰值。避开 runner 自带的 /swapfile。
      - name: Boost swap for FULL LTO link
        run: |
          set -eo pipefail
          echo "--- swap/disk 现状 ---"
          swapon --show || true
          free -h
          df -h / | tail -1
          # 尚无额外 swap 时，按根分区可用空间动态配（上限 10G，预留 3G 给 build 产物），
          # 避免固定大文件撑爆磁盘；vm.swappiness 默认 60，内存压力大时会主动换页，保证 swap 被用上。
          if [ ! -f /swapfile_lto ]; then
            avail_mb=$(df --output=avail -m / | tail -1 | tr -d ' ')
            want_mb=$(( (avail_mb - 3072) * 2 / 3 ))
            [ "$want_mb" -gt 10240 ] && want_mb=10240
            [ "$want_mb" -lt 4096 ] && want_mb=4096
            echo "配置额外 swap: ${want_mb}MB"
            sudo fallocate -l ${want_mb}M /swapfile_lto || sudo dd if=/dev/zero of=/swapfile_lto bs=1M count="$want_mb"
            sudo chmod 600 /swapfile_lto
            sudo mkswap /swapfile_lto
            sudo swapon /swapfile_lto
          fi
          echo "--- swap 后 ---"
          swapon --show
          free -h

      - name: Build gki_defconfig vmlinux
        run: |
          export PATH="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:$PWD/prebuilts/gas/linux-x86:$PATH"
          export ARCH=arm64
          export LLVM=1
          # gki_defconfig 的 LTO_CLANG_FULL/CFI_CLANG/KASAN_HW_TAGS 全部依赖 clang 集成汇编器
          # (AS_IS_LLVM)。漏设 LLVM_IAS=1 会被 Kconfig 静默关掉 → 符号 CRC 全面偏移
          # （CI 首跑 crc_diff=4476、missing __cfi_slowpath/kasan_flag_enabled 即此因）。
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          make O=out_gki gki_defconfig
          # 保持 gki_defconfig 原始的 LTO_CLANG_FULL（与 Google KMI 构建严格一致，不做 ThinLTO 妥协），
          # 链接内存峰值靠上一步 boost 的大 swap 扛。
          # 输出重定向：pahole（BTF）在 LTO DWARF 上的 couldn't-find 告警实测千万行级
          # （见 build-kernel.yml 同改），失败时 tail 定位。
          make O=out_gki -j"$(nproc)" vmlinux > build_full.log 2>&1 || {
            echo "=== 构建失败，build_full.log 最后 4000 行 ==="
            tail -n 4000 build_full.log
            exit 1
          }
          echo "=== vmlinux 构建成功；build_full.log 共 $(wc -l < build_full.log) 行 ==="
          echo "=== .config 关键值（核验 LTO/CFI/KASAN/LLVM 是否真开）==="
          grep -E "CONFIG_(LTO|CFI_CLANG|KASAN|CC_IS_CLANG|AS_IS_LLVM|LD_IS_LLD|MODVERSIONS|TRIM_UNUSED_KSYMS)" out_gki/.config || true

      - name: KMI probe (symvers vs abi_gki_aarch64.xml)
        run: |
          python3 .github/scripts/kmi_probe.py out_gki/vmlinux.symvers android/abi_gki_aarch64.xml

      # Stage 2 设备驱动移植的编译验证：在「已证 0 diff」的纯净 gki_defconfig 之上，
      # 临时开 vendor 增量（ARCH_MEDIATEK + mt6893 clk 全家），只编译 drivers/clk/mediatek/
      # 目录验证驱动源码能编过，不重链 vmlinux（省 FULL LTO 时间），也不污染上面的 kmi 判定。
      # 这是 GKI 2.0 纪律：vendor 驱动走最终才会用的 ARCH_MEDIATEK 门控，源代码真正编译通过，
      # 而核心 7298 冻结 KMI 的 0 diff 门禁仍由上面纯净 gki_defconfig 那次独占判定。
      - name: Verify mt6893 clk compiles (vendor increment)
        run: |
          export PATH="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:$PWD/prebuilts/gas/linux-x86:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          # 在纯净 gki_defconfig 之上叠加 vendor 增量 config（只影响 out_gki/.config，不碰源树 defconfig）
          scripts/config --file out_gki/.config \
            --enable ARCH_MEDIATEK \
            --enable COMMON_CLK_MT6893 \
            --enable COMMON_CLK_MT6893_APU0 \
            --enable COMMON_CLK_MT6893_APU1 \
            --enable COMMON_CLK_MT6893_APU2 \
            --enable COMMON_CLK_MT6893_APU_VCORE \
            --enable COMMON_CLK_MT6893_APU_CONN \
            --enable COMMON_CLK_MT6893_APU_MDLA0 \
            --enable COMMON_CLK_MT6893_APU_MDLA1 \
            --enable COMMON_CLK_MT6893_AUDIOSYS \
            --enable COMMON_CLK_MT6893_CAMSYS_MAIN \
            --enable COMMON_CLK_MT6893_CAMSYS_RAWA \
            --enable COMMON_CLK_MT6893_CAMSYS_RAWB \
            --enable COMMON_CLK_MT6893_CAMSYS_RAWC \
            --enable COMMON_CLK_MT6893_IMGSYS1 \
            --enable COMMON_CLK_MT6893_IMGSYS2 \
            --enable COMMON_CLK_MT6893_IMP_IIC_WRAP_C \
            --enable COMMON_CLK_MT6893_IMP_IIC_WRAP_E \
            --enable COMMON_CLK_MT6893_IMP_IIC_WRAP_N \
            --enable COMMON_CLK_MT6893_IMP_IIC_WRAP_S \
            --enable COMMON_CLK_MT6893_IPESYS \
            --enable COMMON_CLK_MT6893_MDPSYS \
            --enable COMMON_CLK_MT6893_MFGCFG \
            --enable COMMON_CLK_MT6893_MMSYS \
            --enable COMMON_CLK_MT6893_SCP_ADSP \
            --enable COMMON_CLK_MT6893_VDECSYS \
            --enable COMMON_CLK_MT6893_VDECSYS_SOC \
            --enable COMMON_CLK_MT6893_VENCSYS_C1 \
            --enable COMMON_CLK_MT6893_VENCSYS
          # 回填 Kconfig 依赖（COMMON_CLK_MEDIATEK 由 mt6893 select、ARCH_MEDIATEK 的 select 链）
          make O=out_gki olddefconfig
          make O=out_gki -j"$(nproc)" drivers/clk/mediatek/
          echo "=== 编出的 mt6893 clk .o 数量（应为 28：clk-mt6893.o + 27 子系统）==="
          ls out_gki/drivers/clk/mediatek/clk-mt6893*.o | wc -l
          ls out_gki/drivers/clk/mediatek/clk-mt6893*.o | sed 's#.*/##'

      # Stage 2 boot-critical 层的 vendor 增量编译验证：pinctrl(mt6885) + pmic(mfd/regulator) + ufs。
      # 复用 clk step 已 enable 的 ARCH_MEDIATEK 累积 config，此处再叠 boot 必需层；
      # 只编对应目录（compile-only，验证头文件/依赖齐全），不重链 vmlinux，不污染上面的 kmi 判定。
      - name: Verify boot-critical layers compile (pinctrl/pmic/ufs)
        run: |
          export PATH="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:$PWD/prebuilts/gas/linux-x86:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          # PINCTRL_MT6397(default MFD_MT6397) 会 select 老框架 PINCTRL_MTK → 编译 broken 死代码
          # pinctrl-mtk-common.c/moore.c（struct mtk_eint_hw 已被 fork 的 mtk-eint.h v2 移除）。
          # ls12 走 paris 框架(mt6885)仅需 PINCTRL_MTK_PARIS，参考 fork defconfig 显式
          # "# CONFIG_PINCTRL_MT6397 is not set"，故这里显式 disable 对齐"能开机"配置。
          scripts/config --file out_gki/.config \
            --enable PINCTRL_MT6885 \
            --enable MFD_MT6397 \
            --disable PINCTRL_MT6397 \
            --enable MFD_MT6360 \
            --enable REGULATOR_MT6359P \
            --enable REGULATOR_MT6360 \
            --enable REGULATOR_MT6315 \
            --enable SCSI_UFS_MEDIATEK
          make O=out_gki olddefconfig
          make O=out_gki -j"$(nproc)" \
            drivers/pinctrl/mediatek/ \
            drivers/mfd/ \
            drivers/regulator/ \
            drivers/scsi/ufs/ \
            drivers/phy/mediatek/
          echo "=== boot-critical .o 清单（缺失即 fail）==="
          ls out_gki/drivers/pinctrl/mediatek/pinctrl-mt6885.o
          ls out_gki/drivers/mfd/mt6397-core.o out_gki/drivers/mfd/mt6360-core.o
          ls out_gki/drivers/regulator/mt6315-regulator.o out_gki/drivers/regulator/mt6359p-regulator.o out_gki/drivers/regulator/mt6360-regulator.o
          ls out_gki/drivers/scsi/ufs/ufs-mediatek.o
          ls out_gki/drivers/phy/mediatek/phy-mtk-ufs.o

      # Stage 2 收尾·批1：audio(mt6885+mt6359p) + 底座 soc/mediatek(scpsys/pmic-wrap/dvfsrc/socinfo/devapc)。
      # 复用累积 config（ARCH_MEDIATEK + clk + boot-critical 已 enable），再叠 audio + soc 底座；
      # 只编对应目录，不重链 vmlinux，不污染上面的 kmi 判定（核心 KMI 仍由纯净 gki_defconfig 独占判定）。
      - name: Verify audio + soc/base compile (vendor increment)
        run: |
          export PATH="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:$PWD/prebuilts/gas/linux-x86:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          scripts/config --file out_gki/.config \
            --enable SND_SOC_MT6885 \
            --enable SND_SOC_MT6885_MT6359P \
            --enable MTK_SCPSYS \
            --enable MTK_PMIC_WRAP \
            --enable MTK_DVFSRC \
            --enable MTK_DEVAPC \
            --enable MTK_SOCINFO \
            --enable MTK_INFRACFG
          make O=out_gki olddefconfig
          make O=out_gki -j"$(nproc)" \
            sound/soc/mediatek/ \
            sound/soc/codecs/ \
            drivers/soc/mediatek/
          echo "=== audio .o 清单（缺失即 fail）==="
          ls out_gki/sound/soc/mediatek/mt6885/*.o | wc -l
          ls out_gki/sound/soc/mediatek/common/mtk-afe-platform-driver.o
          ls out_gki/sound/soc/codecs/mt6359.o
          echo "=== soc 底座 .o 清单（缺失即 fail）==="
          ls out_gki/drivers/soc/mediatek/mtk-scpsys.o
          ls out_gki/drivers/soc/mediatek/mtk-pmic-wrap.o
          ls out_gki/drivers/soc/mediatek/mtk-dvfsrc.o
          ls out_gki/drivers/soc/mediatek/mtk-socinfo.o
          ls out_gki/drivers/soc/mediatek/devapc/ | wc -l

      # Stage 2 收尾·批2：drm 显示（mediatek_v2 + mml）+ panel(HX83121A) + iommu/smi + cmdq ext。
      # 复用累积 config（ARCH_MEDIATEK + clk + boot-critical + audio/soc 已 enable）。
      # gki_defconfig 缺 DRM DSI/KMS/panel/bridge 核心 helper，需显式开，否则 mediatek_v2/panel 被丢弃。
      # 只编对应目录，不重链 vmlinux，不污染上面的 kmi 判定。
      - name: Verify drm(v2/mml)+panel+iommu compile (vendor increment)
        run: |
          export PATH="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:$PWD/prebuilts/gas/linux-x86:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          scripts/config --file out_gki/.config \
            --enable DRM_MIPI_DSI \
            --enable DRM_KMS_HELPER \
            --enable DRM_PANEL \
            --enable DRM_BRIDGE \
            --enable DRM_MEDIATEK \
            --enable DRM_MEDIATEK_V2 \
            --enable MTK_MML \
            --enable MTK_IOMMU \
            --enable MTK_IOMMU_MISC \
            --enable MTK_SMI \
            --enable MTK_CMDQ_MBOX_EXT \
            --disable MTK_CMDQ \
            --enable DRM_PANEL_LUSHAN12_HX83121A_CDOT_CSOT_WQXGA_VDO \
            --enable DRM_PANEL_LUSHAN12_HX83121A_CDOT_CSOT_WITHOUT_VCOM_WQXGA_VDO \
            --enable AW3750X_POWER \
            --enable MTK_AAL_SUPPORT \
            --enable PWM_MTK_DISP \
            --enable MTK_ROUND_CORNER_SUPPORT \
            --enable MTK_AEE_FEATURE \
            --enable MTK_AEE_AED
          make O=out_gki olddefconfig
          make O=out_gki -j"$(nproc)" \
            drivers/gpu/drm/mediatek/ \
            drivers/gpu/drm/panel/
          echo "=== drm_v2/mml/panel .o 清单（缺失即 fail）==="
          ls out_gki/drivers/gpu/drm/mediatek/mediatek_v2/mtk_drm_drv.o
          # 注：mml/Makefile `mtk-mml-legacy-objs := mtk-mml.o` 令 mtk-mml.o 成为 multi-used
          # 复合对象，kbuild 不会单独 emit 顶层 mtk-mml.o（子对象直接进 built-in.a）。
          # 故断言子对象 mtk-mml-driver.o + built-in.a（AR 成功即有），而非不存在的 mtk-mml.o。
          ls out_gki/drivers/gpu/drm/mediatek/mml/mtk-mml-driver.o
          ls out_gki/drivers/gpu/drm/mediatek/mml/built-in.a
          ls out_gki/drivers/gpu/drm/panel/lushan12_hx83121a_cdot_csot_wqxga_dsi_vdo.o
          ls out_gki/drivers/gpu/drm/panel/lushan12_hx83121a_cdot_csot_without_vcom_wqxga_dsi_vdo.o
          ls out_gki/drivers/gpu/drm/panel/aw3750x_power.o

      # Stage 2 收尾·批3：boot 关键 6 缺口里 4 个真 =y 驱动（spmi-pmif/devmpu/devinfo/auxadc）。
      # 注意：MTK_DRAMC depends on HAVE_MTK_MC 且 ls12 不设伞 config → 与 4.19 同为死码不编，
      # 故不在此断言（忠实镜像 4.19 行为，非缺口）。只编对应目录，不重链 vmlinux。
      - name: Verify gap-drivers compile (spmi-pmif/devmpu/devinfo/auxadc)
        run: |
          export PATH="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:$PWD/prebuilts/gas/linux-x86:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          scripts/config --file out_gki/.config \
            --enable SPMI_MTK_PMIF \
            --enable MTK_DEVMPU \
            --enable MTK_DEVINFO \
            --enable MEDIATEK_MT635X_AUXADC
          make O=out_gki olddefconfig
          make O=out_gki -j"$(nproc)" \
            drivers/spmi/ \
            drivers/soc/mediatek/ \
            drivers/nvmem/ \
            drivers/iio/adc/
          echo "=== gap-driver .o 清单（缺失即 fail；=y 复合 obj 产出的是子 .o）==="
          ls out_gki/drivers/spmi/spmi-mtk-pmif-core.o
          ls out_gki/drivers/spmi/spmi-mtk-debug.o
          ls out_gki/drivers/spmi/spmi-mtk-mpu.o
          ls out_gki/drivers/soc/mediatek/devmpu/devmpu.o
          ls out_gki/drivers/nvmem/mtk-devinfo.o
          ls out_gki/drivers/iio/adc/mt635x-auxadc.o

      - name: Upload KMI probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmi-probe
          path: |
            out_gki/vmlinux.symvers
            out_gki/.config
          if-no-files-found: warn
