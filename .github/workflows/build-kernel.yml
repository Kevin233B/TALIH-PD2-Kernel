name: Build ls12 Device Kernel

# Stage 3「恢复开机」专用：gki_defconfig 叠加 ls12_gki.fragment 编出可开机的 ls12 设备内核
# （Image + dtbs），验证 vendor fragment 能落地成真实 device kernel。
# 与 kmi-probe.yml（gki_defconfig KMI 0-diff 探测 + vendor 增量编译验证）互补：
#   - 本 workflow 关注「fragment 是否编出可开机产物」，全量 LTO 链接会暴露 vmlinux 链接期
#     undefined 符号（如 register_3way_semaphore_notifier/mml_drm_*，ls12 defconfig 注释已点名的坑）。
#   - kmi-probe.yml 关注「核心 KMI 冻结符号 CRC 是否仍 0 diff」。

on:
  workflow_dispatch:
  push:
    branches: [ gki-5.10-rebase ]
  pull_request:
    branches: [ gki-5.10-rebase ]

jobs:
  build:
    name: ls12 device kernel (Image + dtbs)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official Clang toolchain (clang-r416183b)
        run: |
          set -eo pipefail
          mkdir -p prebuilts-master/clang/host/linux-x86/clang-r416183b
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/6e3223f76384455acde43affde3df0ea9df66c0d/clang-r416183b.tar.gz" \
            -o /tmp/clang-r416183b.tar.gz
          tar -xzf /tmp/clang-r416183b.tar.gz -C prebuilts-master/clang/host/linux-x86/clang-r416183b
          rm -f /tmp/clang-r416183b.tar.gz

      - name: Fetch official binutils (gas)
        run: |
          set -eo pipefail
          mkdir -p prebuilts/gas/linux-x86
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://android.googlesource.com/platform/prebuilts/gas/linux-x86/+archive/b2a189331333e014bfef4c0425b3ef4b74accdd0.tar.gz" \
            -o /tmp/gas.tar.gz
          tar -xzf /tmp/gas.tar.gz -C prebuilts/gas/linux-x86
          rm -f /tmp/gas.tar.gz

      - name: Install cross binutils + host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc flex bison libssl-dev libelf-dev libncurses-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Install pahole 1.20 (5.10-compatible BTF)
        run: |
          set -eo pipefail
          curl -fsSL --retry 3 --retry-delay 5 \
            "http://old-releases.ubuntu.com/ubuntu/pool/universe/d/dwarves-dfsg/dwarves_1.20-1_amd64.deb" \
            -o /tmp/dwarves_1.20-1_amd64.deb
          echo "67efe8ddbf5e16b84a5aa322f4e02955a6939dbbb615dca1f590071641e0acef  /tmp/dwarves_1.20-1_amd64.deb" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y /tmp/dwarves_1.20-1_amd64.deb
          pahole --version

      - name: Boost swap for FULL LTO link
        run: |
          set -eo pipefail
          echo "--- swap/disk 现状 ---"
          swapon --show || true
          free -h
          df -h / | tail -1
          if [ ! -f /swapfile_lto ]; then
            avail_mb=$(df --output=avail -m / | tail -1 | tr -d ' ')
            want_mb=$(( (avail_mb - 3072) * 2 / 3 ))
            [ "$want_mb" -gt 10240 ] && want_mb=10240
            [ "$want_mb" -lt 4096 ] && want_mb=4096
            echo "配置额外 swap: ${want_mb}MB"
            sudo fallocate -l ${want_mb}M /swapfile_lto || sudo dd if=/dev/zero of=/swapfile_lto bs=1M count="$want_mb"
            sudo chmod 600 /swapfile_lto
            sudo mkswap /swapfile_lto
            sudo swapon /swapfile_lto
          fi
          echo "--- swap 后 ---"
          swapon --show
          free -h

      - name: Build device kernel (gki_defconfig + ls12_gki.fragment)
        run: |
          set -eo pipefail
          export PATH="$PWD/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:$PWD/prebuilts/gas/linux-x86:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          # gki_defconfig 为核心底座（LTO_CLANG_FULL/CFI_CLANG/KASAN_HW_TAGS 全开），fragment 只 ADD vendor 设备驱动
          make O=out_device gki_defconfig
          # 叠加 ls12 fragment（-m 只合并不触发 make，随后统一 olddefconfig）
          scripts/kconfig/merge_config.sh -m -O out_device out_device/.config arch/arm64/configs/ls12_gki.fragment
          make O=out_device olddefconfig
          echo "=== .config 关键值（核验核心 flip 未被 fragment 破坏 + vendor 已开）==="
          grep -E "CONFIG_(LTO_CLANG_FULL|CFI_CLANG|KASAN_HW_TAGS|ARCH_MEDIATEK|BLK_DEV_INITRD|DEVTMPFS|COMMON_CLK_MT6893|PINCTRL_MT6885|SCSI_UFS_MEDIATEK|DRM_MEDIATEK_V2|SPMI_MTK_PMIF|MTK_DEVMPU|MTK_DEVINFO|MEDIATEK_MT635X_AUXADC)=" out_device/.config || true
          # 全量编 Image（vmlinux 链接会暴露 vendor 驱动 link 期 undefined）+ dtbs（ls12 dtb）
          # pahole（BTF 阶段）在 FULL LTO 的 DWARF 上每条类型引用打一行 "couldn't find" 告警，
          # 实测单次构建 1120 万行 / 2.3GB，灌爆 Actions 日志 → 全量输出重定向到文件，
          # 日志只留统计；失败时 tail 4000 行（定位信息不丢）。
          make O=out_device -j"$(nproc)" Image dtbs > build_full.log 2>&1 || {
            echo "=== 构建失败，build_full.log 最后 4000 行 ==="
            tail -n 4000 build_full.log
            exit 1
          }
          echo "=== 构建成功；build_full.log 统计 ==="
          wc -l build_full.log
          printf "pahole couldn't-find 告警（已知 LTO DWARF 噪音源）: %s 行\n" \
            "$(grep -c "couldn't find" build_full.log || true)"
          tail -n 20 build_full.log
          # .config 是 dotfile，upload-artifact v4 不会收录隐藏文件 → 复制非隐藏名
          cp out_device/.config out_device/device_config.txt

      # 诊断（常驻）：fragment 对纯 gki_defconfig 到底「翻转/新增」了哪些 config。
      # 46 个 KMI CRC diff 的教训：DRM_FBDEV_EMULATION=y → select FB_DEFERRED_IO →
      # struct fb_info 门控字段出现 → 冻结符号 CRC 漂移。核心 config 的任何翻转都可能
      # 改变冻结结构体布局，此清单让 KMI 破坏一眼定位到 config 根因（只跑 kconfig，秒级）。
      - name: DIAG config drift (fragment vs pure gki)
        if: always()
        run: |
          set -e
          export ARCH=arm64
          make O=out_cfgcheck gki_defconfig >/dev/null
          make O=out_cfgcheck olddefconfig >/dev/null
          python3 - <<'PY'
          def load(p):
              d = {}
              for line in open(p):
                  line = line.strip()
                  if line.startswith("CONFIG_") and "=" in line:
                      k, v = line.split("=", 1)
                      d[k] = v
                  elif line.startswith("# CONFIG_") and line.endswith(" is not set"):
                      d[line[2:-11]] = "n"
              return d
          a = load("out_cfgcheck/.config")   # 纯 gki_defconfig
          b = load("out_device/.config")     # device（fragment 叠加后）
          drift = sorted(k for k in set(a) | set(b) if a.get(k) != b.get(k))
          added  = [k for k in drift if k not in a]
          flipped = [k for k in drift if k in a and k in b]
          removed = [k for k in drift if k not in b]
          print(f"[config_drift] 新增(fragment 独有): {len(added)}  翻转(值改变): {len(flipped)}  消失: {len(removed)}")
          if removed:
              print("  [REMOVED]", " ".join(removed))
          if flipped:
              print("  [FLIPPED]（gki → device，须逐一确认不影响冻结结构体布局）")
              for k in flipped:
                  print(f"    {k}: {a[k]} -> {b[k]}")
          PY

      - name: Verify boot artifacts
        run: |
          set -eo pipefail
          echo "=== Image ==="
          ls -la out_device/arch/arm64/boot/Image
          echo "=== ls12/mt6893 dtb ==="
          ls -la out_device/arch/arm64/boot/dts/mediatek/ls12_mt8797_wifi_64.dtb
          ls -la out_device/arch/arm64/boot/dts/mediatek/mt6893.dtb
          echo "=== 尺寸预算（boot 分区 64MB，原厂 ramdisk 11.67MiB 沿用）==="
          gz=$(gzip -9 -c out_device/arch/arm64/boot/Image | wc -c)
          dtb=$(stat -c%s out_device/arch/arm64/boot/dts/mediatek/ls12_mt8797_wifi_64.dtb)
          python3 - "$gz" "$dtb" <<'PY'
          import math, sys
          gz, dtb, rd = int(sys.argv[1]), int(sys.argv[2]), 12239359
          P = lambda x: math.ceil(x/2048)*2048
          total = 4096 + P(gz) + P(rd) + P(dtb)
          print(f"  Image.gz = {gz/1048576:.2f} MiB（裸 {233145716/1048576:.0f} MiB 参照）")
          print(f"  boot.img 估算 = {total/1048576:.2f} MiB / 64 MiB 分区，余量 {(64*1048576-total)/1048576:+.2f} MiB")
          PY
          # BTF 零填充刀后的预算（若 Size attribution step 产出了 Image.nobtf）
          if [ -f out_device/arch/arm64/boot/Image.nobtf ]; then
            gz2=$(gzip -9 -c out_device/arch/arm64/boot/Image.nobtf | wc -c)
            python3 - "$gz2" "$dtb" <<'PY'
            import math, sys
            gz, dtb, rd = int(sys.argv[1]), int(sys.argv[2]), 12239359
            P = lambda x: math.ceil(x/2048)*2048
            total = 4096 + P(gz) + P(rd) + P(dtb)
            print(f"  [BTF 零填充后] Image.gz = {gz/1048576:.2f} MiB")
            print(f"  [BTF 零填充后] boot.img 估算 = {total/1048576:.2f} MiB / 64 MiB 分区，余量 {(64*1048576-total)/1048576:+.2f} MiB")
            PY
          fi

      # FULL LTO 下 .o 归因无意义（单一 vmlinux.o）→ 尺寸归因只能对 vmlinux 本体做：
      # size 段分布 + nm --size-sort top 符号。刀口选择（KERNEL_ZSTD / KALLSYMS_ALL / 非 boot =y 剥离）
      # 全部以此输出为依据，不再盲猜。
      - name: Size attribution (section sizes + top symbols + BTF-zeroed A/B)
        run: |
          # host(x86) binutils 未必支持 aarch64 ELF → 优先 aarch64-linux-gnu- 前缀工具
          RE=aarch64-linux-gnu-readelf; command -v $RE >/dev/null || RE=readelf
          SZ=aarch64-linux-gnu-size;  command -v $SZ >/dev/null || SZ=size
          NM=aarch64-linux-gnu-nm;    command -v $NM >/dev/null  || NM=nm
          OC=aarch64-linux-gnu-objcopy; command -v $OC >/dev/null || OC=objcopy
          echo "=== vmlinux section sizes（找 .BTF 大头）==="
          $SZ -A out_device/vmlinux | sort -k2 -n -r | head -25 || true
          echo "=== top-40 symbols by size ==="
          $NM -S --size-sort out_device/vmlinux 2>/dev/null | tail -40 || true
          echo "=== A/B: 原 Image.gz vs .BTF 零填充后 Image.gz ==="
          echo -n "orig  Image.gz: "; gzip -9 -c out_device/arch/arm64/boot/Image | wc -c
          # BTF 瘦身刀（零填充版，勿用 -R .BTF！）：
          # arm64 Image 可重定位（head.S 按 .rela.dyn 以 _text 为基址打补丁，文件偏移
          # 必须严格等于 vma-_text）——.BTF 在 RO_DATA 中段，-R 剔除会把后续所有段文件
          # 偏移前移 size(.BTF)，而重定位 addend 仍烙链接期 vma → BTF 后符号引用全体
          # 偏移 → 开机即崩。正确刀法 = 原位零填充（objcopy --update-section 等长 0 覆盖）：
          # 布局/重定位 100% 不动，__start_BTF 指向全零 → btf_parse_hdr magic(0xeb9f)
          # 校验 -EINVAL 优雅降级（google 5.10 btf 惰性初始化，boot 期零 BTF 消费），
          # gzip 对 100MB 零只压 ~100KB → gz 收益与剔除等同。KMI 零影响（symvers
          # 链接期已生成）。4.19 原厂无 DEBUG_INFO_BTF 照样全功能开机。
          # readelf -W -S 宽格式单行：[Nr] Name Type Address Off Size ES Flg Lk Inf Al
          # → $2=Name $6=Size（$7 是 EntSize）；Size 是不带 0x 的十六进制 → 16# 转十进制
          BTF_HEX=$($RE -W -S out_device/vmlinux | awk '$2==".BTF" {print $6}')
          BTF_SIZE=$((16#$BTF_HEX))
          if [ -n "$BTF_SIZE" ] && [ "$BTF_SIZE" -gt 0 ] 2>/dev/null; then
            echo ".BTF raw size = $BTF_SIZE bytes"
            truncate -s "$BTF_SIZE" /tmp/btf_zeros.bin
            $OC --update-section .BTF=/tmp/btf_zeros.bin \
              out_device/vmlinux out_device/vmlinux.btfzeroed || true
            $OC -O binary -R .note -R .note.gnu.build-id -R .comment -S \
              out_device/vmlinux.btfzeroed out_device/arch/arm64/boot/Image.nobtf || true
            ls -la out_device/arch/arm64/boot/Image.nobtf || true
            echo -n "nobtf Image.gz: "; gzip -9 -c out_device/arch/arm64/boot/Image.nobtf | wc -c || true
          else
            echo ".BTF 不存在或为空（跳过 A/B）"
          fi

      # Stage 3 硬门禁：device 内核（gki_defconfig + ls12 fragment）的核心冻结 KMI 仍须 0 diff。
      # fragment 只 ADD vendor 设备驱动，不改 LTO/CFI/KASAN/NR_CPUS/PREEMPT 等核心 flip，
      # 核心头文件又是 rebase 纯净（kernel/mm/fs/net/security 0 diff）→ 7298 冻结符号 CRC 应全对齐。
      # 若此处 crc_diff/missing 非 0，即 vendor 增量越界污染了核心 KMI，须修到 0。
      - name: KMI strictness (device kernel frozen CRC still 0 diff)
        run: |
          python3 .github/scripts/kmi_probe.py out_device/vmlinux.symvers android/abi_gki_aarch64.xml

      # 5.10 刷机硬前提：dtbo 必须刷「空 dt_table + 内嵌空 FDT」——5.10 dtb 已重编号，
      # 不可再叠 4.19 工厂 overlay（81 fragment 全是占位符+符号重定位，跨版必错）。
      # lk（odm_mdtbo.c）有 4 个 assert(0) 硬砖点 → count=0/全 0/全 0xff 都会砖，
      # 唯一安全形态 = 合法 dt_table(magic d7b7ab1e 大端) + count=1 + 72B 空 FDT
      # （ufdt 遍历 0 fragment = no-op）。脚本自带四 assert 点回读自检。
      - name: Generate empty dtbo (lk-safe)
        run: |
          python3 .github/scripts/gen_empty_dtbo.py out_device/empty_dtbo.img
          xxd out_device/empty_dtbo.img | head -3

      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ls12-boot
          path: |
            out_device/arch/arm64/boot/Image
            out_device/arch/arm64/boot/Image.nobtf
            out_device/arch/arm64/boot/dts/mediatek/ls12_mt8797_wifi_64.dtb
            out_device/arch/arm64/boot/dts/mediatek/mt6893.dtb
            out_device/empty_dtbo.img
            out_device/device_config.txt
          if-no-files-found: warn
